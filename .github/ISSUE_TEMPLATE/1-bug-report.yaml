name: Bug report 🐛
description: Report a bug
labels:
    - bug
assignees:
    - hfsoulz
title: '[bug] '
body:
    - type: markdown
      attributes:
          value: Thanks for taking the time to fill out this bug report!
    - type: checkboxes
      attributes:
          label: Is there an existing issue?
          options:
              - label: I have searched the existing issues
                required: true
    - type: input
      attributes:
          label: Rust Version
          description: Output of `rustc -V`
      validations:
          required: true
    - type: input
      attributes:
          label: Version
          description: Can be found in `Cargo.toml` of your project (`version` field in `[package]` section).
      validations:
          required: true
    - type: textarea
      attributes:
          label: Steps to reproduce the bug
          description: A command like `cargo run -- options...` or multiple commands.
      validations:
          required: true
    - type: textarea
      attributes:
          label: Actual Behaviour
          description: When I do like *this*, *that* is happening and I think it shouldn't.
      validations:
          required: true
    - type: textarea
      attributes:
          label: Expected Behaviour
          description: I think *this* should happen instead.
      validations:
          required: true
    - type: textarea
      attributes:
          label: Additional Context
          description: Add any other context about the problem here.
