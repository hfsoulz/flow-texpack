name: Create Github Release (with assets)

on:
    push:
        tags:
            - 'v*'

jobs:
    publish:
        name: Publish for ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact_name: flow-texpack
                      asset_name: x86_64-linux
                    - os: windows-latest
                      artifact_name: flow-texpack
                      asset_name: x86_64-windows
                    - os: macos-latest
                      artifact_name: flow-texpack
                      asset_name: aarch64-apple-darwin

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set the release version
              shell: bash
              run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> $GITHUB_ENV

            - run: echo ${{ env.RELEASE_VERSION }}

            - run: cargo install git-cliff
            - run: git-cliff -o CHANGELOG.md
            - run: git-cliff --latest --strip header -o CHANGES.md
            - run: cat CHANGELOG.md
            - run: cat CHANGES.md

            # This step reads a file from repo and use it for body of the release
            # This works on any self-hosted runner OS
            - name: Read CHANGES.md and use it as a body of new release
              id: read_release
              shell: bash
              run: |
                  r=$(cat CHANGES.md)                               # <--- Read CHANGES.md (Provide correct path as per your repo)
                  r="${r//'%'/'%25'}"                               # Multiline escape sequences for %
                  r="${r//$'\n'/'%0A'}"                             # Multiline escape sequences for '\n'
                  r="${r//$'\r'/'%0D'}"                             # Multiline escape sequences for '\r'
                  echo "RELEASE_BODY=$r" >> $GITHUB_OUTPUT          # <--- Set environment variable

            - name: Build
              run: cargo build --release --locked

            - name: Prepare release assets
              shell: bash
              run: |
                  mkdir -pv release
                  cp {AUTHORS,LICENSE,README.md,CHANGELOG.md} release/
                  if [ "${{ matrix.os }}" = "windows-latest" ]; then
                    cp "target/release/${{ matrix.artifact_name }}.exe" release/
                  else
                    cp "target/release/${{ matrix.artifact_name }}" release/
                  fi
                  mv release/ ${{ matrix.artifact_name }}-${{ env.RELEASE_VERSION }}/

            - name: Create release artifacts
              shell: bash
              run: |
                  if [ "${{ matrix.os }}" = "windows-latest" ]; then
                    7z a -tzip "${{ matrix.artifact_name }}-${{ env.RELEASE_VERSION }}-${{ matrix.asset_name }}.zip" \
                    ${{ matrix.artifact_name }}-${{ env.RELEASE_VERSION }}/
                  else
                    tar -czvf ${{ matrix.artifact_name }}-${{ env.RELEASE_VERSION }}-${{ matrix.asset_name }}.tar.gz \
                    ${{ matrix.artifact_name }}-${{ env.RELEASE_VERSION }}/
                  fi

            - name: Upload binaries to release
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.WRITE_TOKEN }}
                  file_glob: true
                  overwrite: true
                  file: ${{ matrix.artifact_name }}-${{ env.RELEASE_VERSION }}-${{ matrix.asset_name }}*
                  tag: ${{ github.ref }}
                  release_name: ${{ github.ref_name }} released
                  body: ${{ steps.read_release.outputs.RELEASE_BODY }}
