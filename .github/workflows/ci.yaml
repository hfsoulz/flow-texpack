name: Rust CI Build/Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Rust CI Build/Test
        runs-on: ubuntu-latest
        env:
            RUST_BACKTRACE: 1
        steps:
            - uses: actions/checkout@v7
            - run: cargo build
            - run: cargo test

    rustfmt:
        name: Format code check (rustfmt)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - run: cargo fmt -- --check
