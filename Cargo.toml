[package]
name = "flow-texpack"
version = "0.2.0"
edition = "2024"
authors = ["Andreas Widen <aw@luflow.net>"]
description = "flow-texpack is a program that will allow you to generate texture atlas from input images (BMP, HDR, JPG, PNG, TGA, TIFF, WEBP). The application generates both texture atlas and descriptions file that can be read by a game."
license = "Zlib"
homepage = "https://luflow.net/"
repository = "https://github.com/hfsoulz/flow-texpack.git"
readme = "README.md"
keywords = ["image atlas", "texture-atlas", "generator", "builder"]
categories = ["command-line-utilities"]
exclude = [".github", ".forgejo", ".gitignore"]

[dependencies]
flow-rectpack = "0.2.2"
tokio = { version = "1.52.3", features = ["macros", "fs", "io-util", "rt-multi-thread"] }
async-recursion = "1.1.1"
rich_rust = "0.2.1"
image = "0.25.10"
clap = { version = "4.6.1", features = ["derive"] }
fern = "0.7.1"
log = "0.4.32"
humantime = "2.3.0"

[dev-dependencies]
assert_cmd = "2.2.2"
